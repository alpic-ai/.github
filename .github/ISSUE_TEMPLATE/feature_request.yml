name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you are trying to solve. Prefer opening this on the **product repository** that should own the change.
  - type: input
    id: repository
    attributes:
      label: Target repository
      description: Where should this land?
      placeholder: e.g. alpic-ai/skybridge
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would you like to see? Sketches and API ideas welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you already tried
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, related issues, or use cases
    validations:
      required: false
